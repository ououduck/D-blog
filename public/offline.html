<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- PWA 离线兜底页：无实质内容，禁止收录（robots.txt 同步 Disallow /offline.html） -->
    <meta name="robots" content="noindex, nofollow" />
    <title>D-blog | 离线中</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(192, 57, 43, 0.16), transparent 35%),
          linear-gradient(180deg, #fafaf9, #f4f4f5);
        color: #18181b;
      }

      .card {
        width: min(92vw, 34rem);
        padding: 2rem;
        border-radius: 1.5rem;
        border: 1px solid rgba(24, 24, 27, 0.08);
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 80px rgba(24, 24, 27, 0.08);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-family: "Playfair Display", serif;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: #52525b;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1.5rem;
      }

      a,
      button.action-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.85rem 1.1rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        font-size: 1rem;
        font-family: inherit;
        cursor: pointer;
      }

      a:focus-visible,
      button.action-button:focus-visible {
        outline: 2px solid #18181b;
        outline-offset: 2px;
      }

      .primary {
        background: #18181b;
        color: #fff;
        border: 0;
      }

      .secondary {
        border: 1px solid rgba(24, 24, 27, 0.12);
        color: #18181b;
        background: rgba(255, 255, 255, 0.7);
      }

      .status-hint {
        margin-top: 0.75rem;
        font-size: 0.8125rem;
        color: #a1a1aa;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(circle at top, rgba(251, 146, 60, 0.14), transparent 35%),
            linear-gradient(180deg, #09090b, #18181b);
          color: #f4f4f5;
        }

        .card {
          border-color: rgba(255, 255, 255, 0.08);
          background: rgba(24, 24, 27, 0.82);
          box-shadow: none;
        }

        p {
          color: #a1a1aa;
        }

        .primary {
          background: #f4f4f5;
          color: #09090b;
        }

        .secondary {
          border-color: rgba(255, 255, 255, 0.12);
          color: #f4f4f5;
          background: rgba(39, 39, 42, 0.88);
        }

        a:focus-visible,
        button.action-button:focus-visible {
          outline-color: #f4f4f5;
        }

        .status-hint {
          color: #71717a;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>当前处于离线状态</h1>
      <p>当前地址不属于可用的站内页面，或应用缓存尚未准备完成；恢复网络后请重试。</p>
      <div class="actions">
        <button type="button" class="action-button primary" id="retry-button">重试连接</button>
        <a class="secondary" href="./">返回首页</a>
        <a class="secondary" href="./feed.xml">查看 RSS</a>
      </div>
      <p class="status-hint" id="online-hint" role="status" aria-live="polite" hidden>网络已恢复，正在重新加载…</p>
    </main>
    <script>
      (function () {
        var retryButton = document.getElementById('retry-button');
        var onlineHint = document.getElementById('online-hint');
        var reloaded = false;
        var reloadOnce = function () {
          if (reloaded) return;
          reloaded = true;
          if (onlineHint) onlineHint.hidden = false;
          window.location.reload();
        };
        if (retryButton) {
          retryButton.addEventListener('click', reloadOnce);
        }
        // 网络恢复后自动重载一次：离线兜底页无实质内容，重载是唯一有用动作。
        window.addEventListener('online', function () {
          setTimeout(reloadOnce, 800);
        });
        if (navigator.onLine) {
          // 缓存未就绪等非网络原因进入本页时，不自动循环刷新。
          if (retryButton) retryButton.focus();
        }
      })();
    </script>
  </body>
</html>
