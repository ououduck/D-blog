<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>D-blog</title>
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192.png" />
    <!-- 首屏 CSS 预取：入口样式表为内容哈希文件名（构建后才可知），preload 由
         vite.config.ts 的 inject-entry-css-preload 插件在构建时注入产物 index.html，
         与 Vite 注入的样式表（含 crossorigin）保持一致，避免重复下载。 -->
    <!-- 模板级兜底 meta：生产构建时会被 SSG 的 mergeHead 移除（每页以 Seo 组件的
         实际输出为准），仅作为开发模式 / 未跑 SSG 时的后备。文案与 siteConfig 保持一致。 -->
    <meta name="description" content="跑路的duck的技术分享和生活随笔" />
    <meta name="keywords" content="D-blog,跑路的duck,前端博客,技术分享,编程教程,React,TypeScript,Web开发" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f0e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <!-- color-scheme：声明明暗双模式，让 UA 组件（滚动条/表单控件/默认 canvas 色）在 CSS 加载前适配深色，避免深色模式首帧闪白。mergeHead 不移除该标签，生产构建安全保留。 -->
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>

    <!-- DNS 预解析和预连接优化 -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- 字体加载优化：异步加载避免阻塞渲染，减少不常用权重。
         preload 需带 crossorigin：Google Fonts 的 stylesheet 以 CORS 模式请求，
         缺 crossorigin 时 preload 与正式请求不共享缓存，会导致 CSS 被下载两次。 -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    </noscript>

    <!-- Clarity Analytics：等 load 事件后再注入标签，避免与分析/智能体无关的脚本抢占首屏主线程 -->
    <script>
    (function (c, l, a, r, i, t, y) {
      var inject = function () {
        c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
        t = l.createElement(r);
        t.async = 1;
        t.src = 'https://www.clarity.ms/tag/' + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      };
      if (l.readyState === 'complete' || l.readyState === 'interactive') {
        inject();
      } else {
        l.addEventListener('load', inject);
      }
    })(window, document, 'clarity', 'script', 'wloc3f723i');
    </script>
</head>
  <body class="bg-paper text-ink dark:bg-void dark:text-gray-200 overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>


  <!-- Umami Analytics -->
   <script defer src="https://cloud.umami.is/script.js" data-website-id="2bacf41e-ec6b-470c-9e91-44c78f392e56"></script>
   <!-- End Umami Analytics -->

</body>
</html>
