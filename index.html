<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>D-blog</title>
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192.png" />
    <!-- 首屏 CSS 预取：与 Vite 注入的样式表（含 crossorigin）保持一致，避免预取与正式请求被判定为两个请求而重复下载 -->
    <link rel="preload" as="style" href="%BASE_URL%assets/index.css" crossorigin />
    <meta name="description" content="跑路的duck的个人博客，分享前端技术、编程教程与生活感悟，探索极致的静态页面体验。" />
    <meta name="keywords" content="D-blog,跑路的duck,前端博客,技术分享,编程教程,React,TypeScript,Web开发" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f0e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>

    <!-- DNS 预解析和预连接优化 -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- 字体加载优化：异步加载避免阻塞渲染，减少不常用权重 -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    </noscript>

    <!-- Clarity Analytics：等 load 事件后再注入标签，避免与分析/智能体无关的脚本抢占首屏主线程 -->
    <script>
    (function (c, l, a, r, i, t, y) {
      var inject = function () {
        c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
        t = l.createElement(r);
        t.async = 1;
        t.src = 'https://www.clarity.ms/tag/' + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      };
      if (l.readyState === 'complete' || l.readyState === 'interactive') {
        inject();
      } else {
        l.addEventListener('load', inject);
      }
    })(window, document, 'clarity', 'script', 'wloc3f723i');
    </script>
</head>
  <body class="bg-paper text-ink dark:bg-void dark:text-gray-200 overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>


  <!-- Umami Analytics -->
   <script defer src="https://cloud.umami.is/script.js" data-website-id="2bacf41e-ec6b-470c-9e91-44c78f392e56"></script>
   <!-- End Umami Analytics -->

</body>
</html>
