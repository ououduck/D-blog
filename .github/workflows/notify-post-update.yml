name: Notify Blog Post Update

on:
  push:
    branches: [main]
    paths:
      - 'posts/**/*.md'
  workflow_dispatch:
    inputs:
      post_files:
        description: 'Markdown paths to notify, separated by new lines'
        required: true
        type: string

concurrency:
  # 连续 push 只保留最新一次：防止快速连续提交产生重复通知评论。
  group: notify-post-update
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # push 事件下默认 HEAD 可能缺 refs，显式取完整历史以支持 diff 计算。
          ref: ${{ github.event_name == 'push' && github.sha || '' }}

      - name: Post article notification
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL_POST_FILES: ${{ inputs.post_files }}
          ISSUE_NUMBER: ${{ vars.BLOG_NOTIFY_ISSUE_NUMBER || '6' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # API 瞬时故障重试 3 次（github-script v8 原生支持），
          # 避免偶发 5xx / 网络抖动直接导致通知丢失。
          retries: 3
          script: |
            const childProcess = require('child_process');
            const fs = require('fs');

            // GitHub Issue 评论 body 硬上限 65536 字符；预留尾部标记后使用安全预算。
            const MAX_COMMENT_BODY_CHARS = 60000;

            function getChangedFiles() {
              if (context.eventName === 'workflow_dispatch') {
                return (process.env.MANUAL_POST_FILES || '').split(/\r?\n/).map((file) => file.trim()).filter(Boolean);
              }

              const beforeSha = process.env.BEFORE_SHA;
              const afterSha = process.env.AFTER_SHA;

              // 首次推送（before 为全零）：取该 commit 新增的文章文件。
              if (beforeSha === '0000000000000000000000000000000000000000') {
                return childProcess.execFileSync('git', ['show', '--pretty=', '--name-only', afterSha, '--', 'posts/*.md'], { encoding: 'utf8' }).split(/\r?\n/).map((file) => file.trim()).filter(Boolean);
              }

              // 常规 diff；force-push 等场景下 before 可能不在本地历史中，
              // diff 失败时回退为"该 commit 新增的文章文件"，保证通知不丢失。
              try {
                return childProcess.execFileSync('git', ['diff', '--name-only', '--diff-filter=AM', beforeSha, afterSha, '--', 'posts/*.md'], { encoding: 'utf8' }).split(/\r?\n/).map((file) => file.trim()).filter(Boolean);
              } catch (error) {
                core.warning(`git diff failed (${error.message}); falling back to commit file list.`);
                return childProcess.execFileSync('git', ['show', '--pretty=', '--name-only', afterSha, '--', 'posts/*.md'], { encoding: 'utf8' }).split(/\r?\n/).map((file) => file.trim()).filter(Boolean);
              }
            }

            function getFrontmatter(content) {
              const match = content.match(/^---\s*\r?\n([\s\S]*?)\r?\n---/);
              if (!match) return {};

              return Object.fromEntries(
                match[1]
                  .split(/\r?\n/)
                  .filter((line) => /^([\w-]+):\s*/.test(line))
                  .map((line) => {
                    const separator = line.indexOf(':');
                    return [line.slice(0, separator).trim(), line.slice(separator + 1).trim().replace(/^['"]|['"]$/g, '')];
                  }),
              );
            }

            // 评论 body 截断辅助：超限时截断并追加提示，避免 GitHub 422 拒绝整个通知。
            function truncateBody(body) {
              if (body.length <= MAX_COMMENT_BODY_CHARS) {
                return body;
              }
              const cutMark = '\n\n---\n*通知过长，其余内容省略。*';
              const budget = MAX_COMMENT_BODY_CHARS - cutMark.length;
              return `${body.slice(0, budget)}${cutMark}`;
            }

            let changedFiles = [];
            try {
              changedFiles = getChangedFiles();
            } catch (error) {
              // git 命令本身失败（如仓库状态异常）：记录后放弃，而非以裸堆栈失败。
              core.error(`Failed to resolve changed files: ${error.message}`);
              core.setFailed('Failed to resolve changed post files.');
              return;
            }
            core.info(`Changed post files: ${changedFiles.join(', ') || 'none'}`);

            const posts = changedFiles.flatMap((file) => {
              if (!fs.existsSync(file)) {
                core.warning(`Skipping ${file}: file does not exist in this workflow checkout.`);
                return [];
              }

              let content;
              try {
                content = fs.readFileSync(file, 'utf8');
              } catch (error) {
                core.warning(`Skipping ${file}: failed to read (${error.message}).`);
                return [];
              }
              const frontmatter = getFrontmatter(content);

              if (frontmatter.draft === 'true') {
                core.info(`Skipping draft: ${file}`);
                return [];
              }

              if (!frontmatter.id) {
                const fallbackId = file.replace(/^posts\//, '').replace(/\.md$/, '');
                core.warning(`Missing id front matter in ${file}; using filename fallback: ${fallbackId}.`);
                frontmatter.id = fallbackId;
              }

              return [{
                title: frontmatter.title || frontmatter.id,
                excerpt: frontmatter.excerpt,
                date: frontmatter.date,
                url: `https://blog.pldduck.com/post/${encodeURIComponent(frontmatter.id)}`,
              }];
            });

            if (posts.length === 0) {
              // 无已发布文章可通知（全部为草稿/删除/不存在）：
              // 以 warning 而非 setFailed 结束，避免"例行 push 也红叉"的噪音。
              core.warning(`No published posts to notify. Changed files: ${changedFiles.join(', ') || 'none'}.`);
              return;
            }

            const commit = context.payload.head_commit;
            let body = '## D-blog has new article updates\n\n';

            for (const post of posts) {
              body += `### [${post.title}](${post.url})\n\n`;
              if (post.excerpt) body += `${post.excerpt}\n\n`;
              if (post.date) body += `Published: ${post.date}\n\n`;
            }

            if (commit) {
              body += `Commit: [${commit.id.slice(0, 7)}](${commit.url}) - ${commit.message.split('\n')[0]}\n\n`;
            }
            body += '---\n*This notification was posted automatically by GitHub Actions.*\n';

            try {
              const result = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.ISSUE_NUMBER),
                body: truncateBody(body),
              });
              core.info(`Notification posted: ${result.data.html_url}`);
            } catch (error) {
              // 评论创建失败（422 长度 / 权限 / Issue 不存在）：完整上下文后失败。
              core.error(`Failed to post notification: ${error.message}`);
              core.setFailed('Failed to post article update notification.');
            }
