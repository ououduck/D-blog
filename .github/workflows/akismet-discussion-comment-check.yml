name: Akismet Discussion Comment Checker

on:
  discussion_comment:
    types: [created]

permissions:
  contents: read
  discussions: write

jobs:
  check-akismet:
    runs-on: ubuntu-latest
    steps:
      - name: Check and delete spam comments
        uses: actions/github-script@v8
        env:
          AKISMET_API_KEY: ${{ secrets.AKISMET_API_KEY }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const apiKey = process.env.AKISMET_API_KEY;
            if (!apiKey) {
              core.setFailed('AKISMET_API_KEY is not configured.');
              return;
            }

            const comment = context.payload.comment;
            const discussion = context.payload.discussion;
            const repository = context.payload.repository;
            const params = new URLSearchParams({
              blog: repository.html_url,
              user_ip: '127.0.0.1',
              user_agent: 'GitHubActionBot/1.0',
              referrer: discussion.html_url,
              comment_type: 'comment',
              comment_author: comment.user.login,
              comment_author_url: comment.user.html_url,
              comment_content: comment.body,
            });

            core.info(`Checking comment from @${comment.user.login}: ${comment.html_url}`);
            const response = await fetch(`https://${apiKey}.rest.akismet.com/1.1/comment-check`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'User-Agent': 'D-blog Akismet Action/1.0',
              },
              body: params,
            });
            const result = (await response.text()).trim();

            if (!response.ok || !['true', 'false'].includes(result)) {
              core.setFailed(`Akismet returned HTTP ${response.status}: ${result || 'empty response'}`);
              return;
            }

            if (result === 'false') {
              core.info('Akismet marked the comment as legitimate.');
              return;
            }

            core.warning(`Akismet marked the comment from @${comment.user.login} as spam.`);
            await github.graphql(
              `mutation DeleteDiscussionComment($commentId: ID!) {
                deleteDiscussionComment(input: { id: $commentId }) {
                  clientMutationId
                }
              }`,
              { commentId: comment.node_id },
            );
            core.info('Spam comment deleted.');
