name: Akismet Discussion Comment Checker

on:
  discussion_comment:
    types: [created]

permissions:
  contents: read
  discussions: write

concurrency:
  # 同一次讨论的并发评论串行处理（防同一 comment 重复检查/重复删除）。
  group: akismet-discussion-${{ github.event.discussion.node_id }}
  cancel-in-progress: false

jobs:
  check-akismet:
    runs-on: ubuntu-latest
    # 脚本内部已有超时（Akismet 15s × 4 次尝试 + GraphQL 20s × 3 次尝试 ≈ 2 分钟），
    # 5 分钟上限留足余量且保证事件级 job 快速释放。
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check and delete spam comments
        # 使用自动注入的 GITHUB_TOKEN（修复原 GH_TOKEN 引用 bug：
        # 仓库未配置 GH_TOKEN secret 时本 job 直接失效）。
        # AKISMET_API_KEY 缺失时脚本优雅降级（::warning:: + 正常退出），
        # 不会让每次评论都触发红叉；配置 secret 后自动恢复防护。
        env:
          AKISMET_API_KEY: ${{ secrets.AKISMET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/akismet-comment-check.mjs
