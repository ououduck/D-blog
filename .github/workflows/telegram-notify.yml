# telegram-notify.yml — GitHub 事件 → Telegram 推送（D-blog 项目消息提醒）。
#
# 覆盖三类提醒：
#   1. 💬 新评论 / 新讨论 / 新 Issue（giscus 文章评论、留言板留言等）；
#   2. 🚀 push 到 main 的提交（提交列表 + 对比链接）；
#   3. ⚙️ 白名单内任一 Action 运行完成的结果（成功/失败/取消）。
#
# 触发：
#   - push: main 分支提交（.pages.yml 保存内容等都会走到这里）；
#   - discussion_comment: created（giscus 评论）；
#   - discussion: created（新建讨论）；
#   - issues: opened（新 Issue）；
#   - workflow_run: completed（白名单内 workflow 的运行结果；白名单不含本工作流自身，
#     避免每次通知运行完成后又触发一次自身运行 —— 双倍 Actions 消耗）；
#   - workflow_dispatch（手动测试；可配合 .pages.yml「🔔 测试 Telegram 通知」按钮）。
#
# 一次性配置（仓库 Settings → Secrets and variables → Actions）：
#   TELEGRAM_BOT_TOKEN — BotFather 创建机器人得到的 token（形如 123456:ABC-...）；
#   TELEGRAM_CHAT_ID   — 接收消息的 chat id（私聊 / 群组 / 频道均可）；
#   TELEGRAM_TOPIC_ID  — 可选：论坛话题 id，设置后消息发往该话题。
# 未配置 token / chat id 时脚本优雅跳过（::warning:: 正常退出），不会红叉。
name: Telegram Notify

on:
  push:
    branches: [main]
  discussion_comment:
    types: [created]
  discussion:
    types: [created]
  issues:
    types: [opened]
  workflow_run:
    # workflows 为必填键（缺失时 GitHub 拒绝解析，报 "does not reference any workflows"）。
    # 使用显式白名单（不含本工作流自身）：若用 "**" 通配，本工作流每次运行完成后
    # 也会触发一次自身的 workflow_run（脚本虽按名称跳过发送，但运行本身照常创建，
    # 每个事件产生 2 次运行、双倍 Actions 消耗）。
    # ⚠️ 白名单需手动维护：新增 workflow 时在此补充，否则其运行结果（尤其失败）会静默。
    # 注意 check-broken-links.yml 为每周定时任务，已在白名单内，失败会提醒；勿删。
    workflows:
      - "Akismet Discussion Comment Checker"
      - "CI"
      - "Check Broken Links"
      - "Comment Keyword Filter"
      - "Comment Keyword Recheck"
      - "Deploy to Cloudflare & EdgeOne"
      - "Notify Blog Post Update"
    types: [completed]
  workflow_dispatch:
    inputs:
      payload:
        description: 'Pages CMS payload as JSON，手动触发可用 {"repository":{"ref":"main"}}'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # 事件密集时串行发送（不取消：每条消息都值得送达，排队而非丢弃）。
  group: telegram-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # 脚本只读事件载荷 + 调 Telegram API，正常 1 分钟内完成；5 分钟上限防失控。
    timeout-minutes: 5
    steps:
      - name: Check out repository
        # v5：v4 目标 Node 20 已被弃用（2025-09 起强制跑 Node 24），升级消除弃用警告。
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: node scripts/telegram-notify.mjs
