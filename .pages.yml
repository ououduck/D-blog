# PagesCMS 配置 — D-blog 内容管理
# 文档: https://pagescms.org/docs/configuration/
content:
  # ── 文章集合 ──
  - name: posts
    label: 文章
    type: collection
    path: posts
    format: yaml-frontmatter
    filename: "{fields.id}.md"
    fields:
      - { name: id, label: URL标识, type: string, required: true }
      - { name: title, label: 标题, type: string }
      - { name: excerpt, label: 摘要, type: text }
      - { name: date, label: 发布日期, type: date }
      - { name: updatedAt, label: 更新日期, type: date }
      - name: category
        label: 分类
        type: select
        options:
          values: ["教程", "技术", "分享", "其他"]
      - { name: tags, label: 标签, type: string, list: true }
      - { name: coverImage, label: 封面图链接, type: string }
      - { name: author, label: 作者, type: string }
      - { name: featured, label: 精选, type: boolean }
      - { name: featured-top, label: 精选置顶权重, type: number }
      - { name: series, label: 系列文章, type: boolean }
      - { name: series-name, label: 系列名, type: string }
      - { name: series-order, label: 系列顺序, type: number }
      - { name: draft, label: 草稿, type: boolean }
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true   # 允许切换源码模式编辑数学公式/Mermaid/嵌套图片链接

  # ── 说说（短动态）集合：类似朋友圈的一句话动态，MD 格式书写 ──
  - name: shuoshuo
    label: 说说
    type: collection
    path: shuoshuo
    format: yaml-frontmatter
    filename: "{fields.id}.md"
    view:
      primary: date
      sort: date
      order: desc
    fields:
      - { name: id, label: URL标识, type: string, required: true }
      - { name: date, label: 发布时间, type: date, required: true }
      - name: images
        label: 图片链接（可选，九宫格展示）
        type: string
        list: true
      - name: body
        label: 内容
        type: rich-text
        options:
          format: markdown
          switcher: true

  # ── 友链集合：直接读写 friends/ 目录下的 JSON 文件，不改动既有文件结构 ──
  - name: friends
    label: 友链
    type: collection
    path: friends
    format: json
    filename: "{fields.name}.json"
    view:
      primary: name
    fields:
      - { name: name, label: 站点名称, type: string, required: true }
      - { name: description, label: 站点简介, type: text, required: true }
      - { name: avatar, label: 头像地址, type: string, required: true }
      - { name: url, label: 站点地址, type: string, required: true }
      - { name: unavailable, label: 已失联（由检查 Action 自动维护）, type: boolean }

  # ── 评论关键词配置（单文件，CMS 中直接编辑，保存即推送到仓库生效）──
  - name: commentKeywords
    label: 评论关键词
    type: file
    path: config/comment-keywords.json
    format: json
    fields:
      - { name: description, label: 配置说明, type: text, hidden: true }
      - name: action
        label: 评论命中动作
        type: select
        options:
          values: ["minimize", "delete", "none"]
      - name: discussionAction
        label: 新建讨论命中动作
        type: select
        options:
          values: ["delete", "none"]
      - { name: exemptUsers, label: 豁免用户（不审核）, type: string, list: true }
      - { name: keywords, label: 关键词（子串匹配）, type: string, list: true }
      - { name: patterns, label: 正则表达式（忽略大小写）, type: string, list: true }

  # ── 站点配置（单文件：config/site.config.json，CMS 中直接编辑，保存即推送生效）──
  - name: siteConfig
    label: 站点配置
    type: file
    path: config/site.config.json
    format: json
    fields:
      - { name: title, label: 站点标题, type: string, required: true }
      - { name: subtitle, label: 站点副标题, type: string }
      - { name: seoHomeTitle, label: 首页 SEO 标题, type: string }
      - { name: description, label: 站点描述, type: text, required: true }
      - { name: logo, label: Logo 链接, type: string }
      - { name: logoSmall, label: 小 Logo 路径, type: string }
      - { name: seoImage, label: 分享图链接, type: string }
      - { name: footerText, label: 页脚版权文字, type: string }
      - { name: url, label: 站点 URL, type: string, required: true }
      - name: social
        label: 社交链接
        type: object
        fields:
          - { name: github, label: GitHub, type: string }
          - { name: email, label: 邮箱（mailto:）, type: string }
          - { name: rawEmail, label: 邮箱地址, type: string }
      - name: author
        label: 作者信息
        type: object
        fields:
          - { name: name, label: 昵称, type: string, required: true }
          - { name: avatar, label: 头像链接, type: string }
          - { name: role, label: 身份/角色, type: string }
          - { name: bio, label: 简介, type: text }
      - name: toc
        label: 目录设置
        type: object
        fields:
          - { name: collapseInactiveRootBranches, label: 折叠非激活分支, type: boolean }
      - { name: giscusEnabled, label: 启用 Giscus 评论, type: boolean }
      - name: comments
        label: Giscus 评论配置（改动需与 GitHub 实际值一致，否则评论区失效）
        type: object
        fields:
          - { name: repo, label: 仓库, type: string }
          - { name: repoId, label: 仓库 ID, type: string }
          - { name: category, label: 分类名, type: string }
          - { name: categoryId, label: 分类 ID, type: string }
      - name: guestbook
        label: 留言板
        type: object
        fields:
          - { name: discussionId, label: Discussion ID, type: number }
      - name: friendsPage
        label: 友链页
        type: object
        fields:
          - { name: repoUrl, label: 仓库地址, type: string }
          - { name: repoFriendsUrl, label: 友链目录地址, type: string }
          - { name: repoFriendsDir, label: 友链目录名, type: string }
      - name: beian
        label: 备案信息
        type: object
        fields:
          - { name: text, label: 备案号, type: string }
          - { name: url, label: 备案链接, type: string }

# ── 部署动作：CMS 侧边栏按钮，触发 .github/workflows/deploy.yml ──
# 文档: https://pagescms.org/docs/configuration/actions/
actions:
  - name: deploy-site
    label: 🚀 部署到 Cloudflare & EdgeOne
    workflow: deploy.yml
    ref: current
    confirm:
      title: 确认部署？
      message: 将在 GitHub Actions 中构建全站，并直传部署到 Cloudflare Pages 与 EdgeOne Pages
      button: 开始部署

  # ── 评论关键词全量复查：每次执行都会重新审查一次所有评论 ──
  - name: recheck-comments
    label: 🔍 重新审查全部评论
    workflow: comment-keyword-recheck.yml
    ref: current
    confirm:
      title: 确认重新审查全部评论？
      message: 将遍历仓库内全部评论，使用当前「评论关键词」配置重新匹配并执行处理动作（minimize 折叠 / delete 删除 / none 仅记录）。已放行的评论不会被反向恢复。
      button: 开始审查

  # ── 友链可用状态检查：逐个访问友链，标记失联/自动恢复，结果直接推送仓库 ──
  - name: check-friends
    label: 🩺 检查友链可用状态
    workflow: friend-link-check.yml
    ref: current
    confirm:
      title: 确认检查全部友链？
      message: 将逐个访问所有友链网站：无法访问的站点会标记为「已失联」，重新上线的站点会自动恢复为正常状态。检查结果会以单个 commit 直接推送到仓库（不触发部署）。
      button: 开始检查
